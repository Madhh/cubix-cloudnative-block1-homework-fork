# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    branches:
    - main
jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        cache: 'maven'
    - name: Check Java version
      run: java -version
    - name: Build with Maven
      run: ./mvnw package
    - name: Upload artifact for Docker job
      uses: actions/upload-artifact@v4
      with:
        name: java-app
        path: ${{ github.workspace }}/target/*.jar
    
  docker_publish:
    runs-on: ubuntu-latest
    needs: maven
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Download artifact from Maven job
      uses: actions/download-artifact@v4
      with:
        name: java-app
    - name: Logging in to Docker
      run: docker login ghcr.io -u madhh -p ${{ github.token }}
    - name: Build the Docker image
      run: docker build . -t ghcr.io/madhh/cubix/1/homework/app:springboot
    - name: Publish the Docker image
      run: docker push ghcr.io/madhh/cubix/1/homework/app:springboot
      
  docker_verify:
    runs-on: ubuntu-latest
    needs: docker_publish
    permissions:
      contents: read
      packages: write
      
    steps:
    - uses: actions/checkout@v4
    - name: Download artifact from Docker Publish job
      uses: actions/download-artifact@v4
      with:
        name: java-app
    - name: Verify Docker image
      run: #!/bin/sh
           docker run -d --name test -p 8080:8080 ghcr.io/madhh/cubix/1/homework/app:springboot > /dev/null
           sleep 10
           curl --fail http://localhost:8080/application/test
           RESULT=$?
           if [ $RESULT -ne 0 ]; 
           then echo "Verification failed, here are the logs";
           docker logs test;
           fi
           docker stop test > /dev/null
           docker rm test > /dev/null
           exit $RESULT
